name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: 35 11 * * * # 6:35 PM in Vietnam

permissions:
  contents: write

# Một lần bấm tay trùng giờ cron sẽ làm hai lần chạy cùng ghi vào main và đẩy nhau ra.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Fetch data
        run: uv run src/fetch.py

      - name: Analyze data
        run: uv run src/analyze.py

      - name: Commit changes
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # add trước rồi mới kiểm: `git diff` không nhìn thấy file mới chưa được theo dõi.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Updated $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin main
