name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: 35 11 * * * # 6:35 PM in Vietnam

permissions:
  contents: write
  issues: write

# Một lần bấm tay trùng giờ cron sẽ làm hai lần chạy cùng ghi vào main và đẩy nhau ra.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Fetch data
        run: uv run src/fetch.py

      - name: Analyze data
        run: uv run src/analyze.py

      - name: Commit changes
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # add trước rồi mới kiểm: `git diff` không nhìn thấy file mới chưa được theo dõi.
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Updated $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin main

      - name: Kiểm tra chữ số vắng mặt bất thường
        id: alerts
        run: uv run src/alerts.py

      - name: Mở hoặc đóng issue cảnh báo
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT: ${{ steps.alerts.outputs.alert }}
          TITLE: ${{ steps.alerts.outputs.title }}
          BODY_PATH: ${{ steps.alerts.outputs.body_path }}
        run: |
          # Kho fork mặc định tắt Issues. Thiếu nó thì chỉ mất phần nhắc, không được làm đỏ cả job.
          if ! gh issue list --limit 1 >/dev/null 2>&1; then
            echo "::warning::Kho chưa bật Issues nên không gửi được cảnh báo. Bật ở Settings > General > Features > Issues."
            exit 0
          fi

          # Nhãn chưa tồn tại thì lệnh list báo lỗi — coi như chưa có issue nào đang mở.
          existing=$(gh issue list --label gan-alert --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ "$ALERT" = "true" ]; then
            if [ -n "$existing" ]; then
              echo "Cập nhật issue #$existing"
              gh issue edit "$existing" --title "$TITLE" --body-file "$BODY_PATH"
            else
              gh label create gan-alert --description "Chữ số vắng mặt bất thường" --color FBCA04 --force
              gh issue create --title "$TITLE" --body-file "$BODY_PATH" --label gan-alert
            fi
          elif [ -n "$existing" ]; then
            echo "Không còn chữ số nào bất thường, đóng issue #$existing"
            gh issue comment "$existing" --body "Không còn chữ số nào vượt ngưỡng hiếm. Tự động đóng cảnh báo."
            gh issue close "$existing"
          else
            echo "Không có chữ số nào vắng mặt bất thường."
          fi
